name: Deploy to Apps Script

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Restore clasp credentials
        run: echo "$CLASP_CREDENTIALS" > ~/.clasprc.json
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

      - name: Push source to Apps Script
        run: npx clasp push --force

      - name: Update the live web app deployment
        run: npx clasp deploy -i "$DEPLOYMENT_ID" -d "Deploy ${{ github.sha }}"
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
