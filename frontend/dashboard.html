<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="has-sidebar">
  <div class="mobile-topbar">
    <button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Open menu">☰</button>
    <h1>Dashboard</h1>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">Almirah Tracker</div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer"></div>
  </aside>

  <div class="cs-dashboard" style="max-width:960px;">
    <div id="dash-loading" class="loading-state">
      <div class="loading-spinner-lg"></div>
      <p>Loading Dashboard…</p>
    </div>
    <div id="dash-error" class="alert-banner" style="display:none;"></div>

    <div id="dash-content" style="display:none;">
      <div class="dash-tiles">
        <div class="dash-tile">
          <div class="dash-tile-num" id="tile-pending-pos">0</div>
          <div class="dash-tile-label">Pending POs (Cutting)</div>
        </div>
        <div class="dash-tile">
          <div class="dash-tile-num" id="tile-pending-bending">0</div>
          <div class="dash-tile-label">Pending Bending</div>
        </div>
        <div class="dash-tile">
          <div class="dash-tile-num" id="tile-pending-decisions">0</div>
          <div class="dash-tile-label">Multi-Yield Decisions Awaiting</div>
        </div>
        <div class="dash-tile">
          <div class="dash-tile-num" id="tile-stock-short">0</div>
          <div class="dash-tile-label">Sheet Sizes Short on Stock</div>
        </div>
      </div>

      <div id="dash-decisions-section" style="display:none;">
        <div class="section-title">Multi-Yield Decisions Awaiting</div>
        <div id="dash-decisions-list"></div>
      </div>

      <div id="dash-stock-section" style="display:none;">
        <div class="section-title">Sheet Sizes Short on Stock</div>
        <div id="dash-stock-list"></div>
      </div>

      <div class="section-title">Recent Activity</div>
      <div id="dash-activity-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
