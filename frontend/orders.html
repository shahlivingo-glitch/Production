<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Production Order Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="has-sidebar">
  <div class="mobile-topbar">
    <button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Open menu">☰</button>
    <h1>Production Order Form</h1>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">Almirah Tracker</div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer"></div>
  </aside>

  <div class="po-layout">
    <div class="column po-form-col">
      <h2>New Production Order</h2>

      <div class="field-row">
        <label>PO Number</label>
        <input id="po-number" readonly>
      </div>
      <div class="field-row">
        <label>Date &amp; Time</label>
        <input id="po-datetime" readonly>
      </div>
      <div class="field-row">
        <label>Model</label>
        <select id="po-model"></select>
      </div>
      <div class="field-row" id="po-plan-row" style="display:none;">
        <label>Cutting Plan</label>
        <select id="po-plan"></select>
      </div>
      <div class="field-row">
        <label>Qty (units to produce)</label>
        <div id="po-qty-wrap">
          <input type="number" id="po-qty" min="0">
        </div>
        <div id="po-bulk-wrap" style="display:none; align-items:center; gap:8px;">
          <button type="button" class="btn-secondary" id="po-bulk-minus-btn" style="padding:6px 12px;">−</button>
          <input type="number" id="po-bulk-multiplier" min="1" step="1" style="width:70px; text-align:center;">
          <button type="button" class="btn-secondary" id="po-bulk-plus-btn" style="padding:6px 12px;">+</button>
          <span>×</span>
          <span id="po-bulk-units" class="muted" style="font-weight:600;"></span>
        </div>
      </div>

      <div id="sheets-required-section"></div>

      <div class="field-row">
        <label>DXF Reference No.</label>
        <input id="po-dxf">
      </div>
      <div class="field-row">
        <label>Colour Plan</label>
        <input id="po-colour">
      </div>
      <div class="field-row">
        <label>Delivery Deadline</label>
        <input type="date" id="po-deadline">
      </div>
      <div class="field-row">
        <label>Customer / Party Name</label>
        <input id="po-party">
      </div>

      <button class="btn-primary btn-block" id="create-po-btn" style="margin-top:14px;">Create PO</button>
    </div>

    <div class="column po-table-col">
      <h2>Production Orders</h2>
      <div id="po-loading" class="loading-state">
        <div class="loading-spinner-lg"></div>
        <p>Loading Production Orders…</p>
      </div>
      <div id="po-error" class="alert-banner" style="display:none;"></div>
      <div id="po-table-wrap" style="overflow-x:auto; display:none;">
        <table class="po-table">
          <thead>
            <tr><th>PO No.</th><th>Date</th><th>Model</th><th>Plan</th><th>Qty</th><th>Total Sheets</th><th>Party</th><th>Cutting Status</th></tr>
          </thead>
          <tbody id="po-table-body"></tbody>
        </table>
      </div>
      <div id="po-table-empty" class="empty-state" style="display:none;">No production orders created yet.</div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="ordersForm.js"></script>
</body>
</html>
