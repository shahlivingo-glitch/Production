<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Almirah Production Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232f6fed'/%3E%3Crect x='24' y='18' width='52' height='64' rx='4' fill='none' stroke='white' stroke-width='6'/%3E%3Cline x1='50' y1='18' x2='50' y2='82' stroke='white' stroke-width='6'/%3E%3Ccircle cx='42' cy='50' r='3' fill='white'/%3E%3Ccircle cx='58' cy='50' r='3' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="topbar" id="topbar" style="display:none;">
      <div class="topbar-title">Almirah Tracker</div>
      <div class="topbar-user">
        <span id="topbar-username"></span>
        <button class="btn btn-secondary" id="logout-btn" style="min-height:36px;padding:8px 14px;">Log out</button>
      </div>
    </div>

    <div class="main" id="login-root">
      <div class="guide-banner">Tap your name, then enter your 4-digit PIN to start your shift.</div>
      <div id="name-step">
        <div class="center-col"><h2>Who's working?</h2></div>
        <div class="name-grid" id="name-grid"></div>
      </div>
      <div id="pin-step" style="display:none;">
        <div class="center-col">
          <h2 id="pin-step-name"></h2>
          <div class="pin-dots" id="pin-dots"></div>
        </div>
        <div class="pin-pad" id="pin-pad"></div>
        <div class="error-text" id="login-error" style="display:none;"></div>
        <div class="center-col" style="margin-top:16px;">
          <button class="btn btn-secondary" id="pin-back-btn">Back</button>
        </div>
      </div>
    </div>

    <div id="dashboard-root" class="main" style="display:none;"></div>
  </div>
  <script src="app.js"></script>
  <script src="demo.js"></script>
  <script src="orders.js"></script>
  <script src="modelSettings.js"></script>
  <script src="cutting.js"></script>
  <script src="bending.js"></script>
  <script src="assembly.js"></script>
  <script src="powder.js"></script>
  <script src="powderStock.js"></script>
  <script src="fitting.js"></script>
  <script src="qc.js"></script>
</body>
</html>
