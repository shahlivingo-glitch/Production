<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cutting Configuration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topbar">
    <h1>Cutting Configuration</h1>
    <nav class="topbar-nav">
      <a href="orders.html">Production Order Form</a>
      <a href="cuttingStage.html">Cutting Stage</a>
      <a href="bendingStage.html">Bending Stage</a>
      <a href="extraPartInventory.html">Extra Part Inventory</a>
      <a href="sheetStock.html">Raw Sheet Stock</a>
    </nav>
  </div>

  <div class="plans-bar" id="plans-bar" style="display:none;">
    <span class="plans-bar-label">Plan:</span>
    <div id="plans-list" class="plans-list"></div>
    <button class="btn-secondary" id="add-plan-btn">+ Add Plan</button>
  </div>

  <div class="save-bar" id="save-bar" style="display:none;">
    <button class="btn-primary" id="save-btn">Save Changes</button>
    <span class="save-status" id="save-status"></span>
  </div>

  <div class="columns">
    <div class="column model-col">
      <h2>Models</h2>
      <div class="add-row">
        <input id="new-model-name" placeholder="New model name">
        <button class="btn-primary" id="add-model-btn">+ Add</button>
      </div>
      <div id="model-loading" class="loading-state">
        <div class="loading-spinner-lg"></div>
        <p>Loading Models…</p>
      </div>
      <div id="model-error" class="alert-banner" style="display:none;"></div>
      <div id="model-list"></div>
    </div>

    <div class="column" id="col-parts">
      <h2>Parts in One Unit</h2>
      <div id="parts-body"></div>
    </div>

    <div class="column" id="col-sheets">
      <h2>Sheets Used for Cutting</h2>
      <div id="plan-type-row" class="field-row" style="display:none; flex-direction:row; align-items:center; gap:8px; flex-wrap:wrap;">
        <label style="margin:0;">Plan Type</label>
        <select id="plan-type-select" style="width:auto;">
          <option value="per-unit">Per-Unit</option>
          <option value="bulk">Bulk</option>
        </select>
        <input id="plan-base-qty" type="number" min="1" placeholder="Base Qty" style="display:none; width:100px;">
      </div>
      <div class="section-hint" id="plan-type-hint" style="display:none;"></div>
      <div id="sheets-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="cuttingConfig.js"></script>
</body>
</html>
