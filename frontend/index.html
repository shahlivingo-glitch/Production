<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cutting Configuration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topbar">
    <h1>Cutting Configuration</h1>
    <nav class="topbar-nav"><a href="orders.html">Production Order Form →</a></nav>
  </div>

  <div class="plans-bar" id="plans-bar" style="display:none;">
    <span class="plans-bar-label">Plan:</span>
    <div id="plans-list" class="plans-list"></div>
    <button class="btn-secondary" id="add-plan-btn">+ Add Plan</button>
  </div>

  <div class="save-bar" id="save-bar" style="display:none;">
    <button class="btn-primary" id="save-btn">Save Changes</button>
    <span class="save-status" id="save-status"></span>
  </div>

  <div class="columns">
    <div class="column model-col">
      <h2>Models</h2>
      <div class="add-row">
        <input id="new-model-name" placeholder="New model name">
        <button class="btn-primary" id="add-model-btn">+ Add</button>
      </div>
      <div id="model-list"></div>
    </div>

    <div class="column" id="col-parts">
      <h2>Parts in One Unit</h2>
      <div id="parts-body"></div>
    </div>

    <div class="column" id="col-sheets">
      <h2>Sheets Used for Cutting</h2>
      <div id="sheets-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="cuttingConfig.js"></script>
</body>
</html>
